<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback form </title>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#020617,#0F172A,#172554,#312E81);
}

.class1{
    width:450px;
    background:rgba(15,23,42,0.75);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 40px rgba(0,0,0,0.6);
}

h1{
    color:#FFFFFF;
    margin-bottom:25px;
    text-align:center;
}

input,
textarea{
    width:100%;
    padding:13px 15px;
    background:#1E293B;
    color:#F8FAFC;
    border:1px solid #334155;
    border-radius:12px;
    outline:none;
    font-size:16px;
    transition:0.3s;
}

input::placeholder,
textarea::placeholder{
    color:#94A3B8;
}

input:focus,
textarea:focus{
    border-color:#3B82F6;
    box-shadow:0 0 12px rgba(59,130,246,.6);
}

textarea{
    height:120px;
    resize:none;
}

.btn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    color:white;
    cursor:pointer;
    background:linear-gradient(135deg,#2563EB,#7C3AED);
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(59,130,246,.35);
}

.btn:active{
    transform:scale(.98);
}

h3{
    color:#F8FAFC;
    margin-top:20px;
}

#output{
    margin-top:10px;
    padding:15px;
    background:#111827;
    color:#E2E8F0;
    border:1px solid #374151;
    border-radius:12px;
    text-align:left;
    white-space:pre-wrap;
    overflow-x:auto;
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#475569;
    border-radius:10px;
}

::-webkit-scrollbar-track{
    background:#0F172A;
}
</style>
        
 
    
</head>
<body>
    <br>
    <main align = "center">
        <div  class="class1">
        <h1 align = "center"  font color = "red"><b>FastAPI Feedback Form</b></h1>

        <input type = text  id = "studentName" placeholder="Student Name"><br><br>
        <input type = text  id = "topic" placeholder="Topic"><br><br>
        <input type = number min="0" max="5" step="1" id = "rating" placeholder="Rating 1 to 5"><br><br>
        <textarea name="Comment" id="comment" placeholder="Comment..."></textarea><br><br>

        <button class="btn" onclick="submitFeedback()">Submit Feedback</button><br><br>
        <h3  id = "res">Response</font></h3>
        <pre id="output"></pre>
        </div>
    </main>
    <script>
    async function submitFeedback() {
      const feedbackData = {
        student_name: document.getElementById("studentName").value,
        topic: document.getElementById("topic").value,
        rating: Number(document.getElementById("rating").value),
        comment: document.getElementById("comment").value
      };

      try {
        //await fetch(): The await keyword pauses the function until the fetch() request is complete, 
        //so the data can be used right after it’s retrieved.
        const response = await fetch("http://127.0.0.1:8000/feedback", {          
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(feedbackData)
        });
        //If the response is successful, it converts the data from the server 
        //(usually in JSON format) into a JavaScript object.
        //If not successful, the control goes to catch block.
        const result = await response.json();

        document.getElementById("output").textContent =
          "Status Code: " + response.status + "\n\n" +
          JSON.stringify(result, null, 2);//the 2 adds 2-space indentation for readability

      } catch (error) {
        document.getElementById("output").textContent =
          "Error: " + error.message;
      }
    }
  </script>
    
    
</body>
</html>
